# 管理画面（Next.js 静的エクスポート）を GitHub Pages に公開する（カスタムドメイン: event.admin.fsif.jp）
name: Deploy admin page to Pages

on:
  push:
    branches: ["main"]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check GAS URL
        env:
          GAS_API_URL: ${{ vars.GAS_API_URL }}
        run: |
          if [ -z "$GAS_API_URL" ]; then
            echo "::error::リポジトリの Variables に GAS_API_URL（GAS ウェブアプリの …/exec URL）を設定してください"
            exit 1
          fi
      - name: Build
        env:
          NEXT_PUBLIC_GAS_API_URL: ${{ vars.GAS_API_URL }}
        run: pnpm build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
